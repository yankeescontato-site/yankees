# Busca os imóveis no site da OAWEB a cada 3 horas. Se algo mudou, salva o data/imoveis.json
# no repositório e a Vercel publica o site de novo sozinha.
name: Importar imóveis da OAWEB

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: importar-imoveis
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # versões fixadas por commit: uma tag alterada por terceiros não muda o que roda aqui
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Importar
        env:
          # Configure em Settings > Variables quando o domínio for para o site novo.
          OAWEB_URL: ${{ vars.OAWEB_URL }}
        run: node scripts/importar-oaweb.mjs
      - name: Importar blog
        env:
          OAWEB_URL: ${{ vars.OAWEB_URL }}
        run: node scripts/importar-blog.mjs
      - name: Salvar se mudou
        run: |
          if git diff --quiet -- data/imoveis.json data/artigos.json; then
            echo "Nenhuma mudança nos imóveis."
            exit 0
          fi
          git config user.name "importador-imoveis"
          git config user.email "actions@users.noreply.github.com"
          git add data/imoveis.json data/artigos.json
          git commit -m "Atualiza imóveis e blog da OAWEB"
          git push
